name: setup-bun
description: "Setup Bun - Cache dependencies - Install dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup Node (Astro 7 requires >=22.23.4)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
